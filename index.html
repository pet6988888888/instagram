<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <title>IG Carousel Creator</title>

    <!-- GOOGLE FONTS -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800&family=Montserrat:wght@400;600;800&family=Roboto:wght@400;700&display=swap" rel="stylesheet">

    <!-- Tailwind -->
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
      tailwind.config = {
        theme: {
          extend: {
            fontFamily: {
              sans: ['Inter', 'sans-serif'],
              inter: ['Inter', 'sans-serif'],
              montserrat: ['Montserrat', 'sans-serif'],
              roboto: ['Roboto', 'sans-serif'],
            },
            colors: {
              'gray-900': '#111827',
              'gray-800': '#1f2937',
              'gray-700': '#374151',
              'indigo-600': '#4f46e5',
              'indigo-700': '#4338ca',
              'yellow-400': '#facc15',
              'green-600': '#10b981',
            },
          },
        },
      }
    </script>

    <!-- React -->
    <script src="https://unpkg.com/react@18/umd/react.development.js"></script>
    <script src="https://unpkg.com/react-dom@18/umd/react-dom.development.js"></script>
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>

    <!-- html2canvas for export -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
</head>
<body class="bg-gray-900">
  <div id="root"></div>

  <script type="text/babel">
    const { useState, useEffect, useRef, useCallback } = React;

    // --- Constants & defaults
    const API_KEY = "AIzaSyCmZyTQUAk4SiUVPSO9olbBbn6_eURR_ho"; // placeholder

    const defaultProfile = {
      name: 'Peter Carvell',
      website: 'Homeworkoutfactory.com',
      photoUrl: 'https://placehold.co/100x100/F7C400/000?text=P',
      isVerified: false,
    };

    const defaultBrandSettings = {
      bgColor: '#000000',
      textColor: '#FFFFFF',
      headlineColor: '#F7C400',
      accentColor: '#F7C400',
      fontFamily: 'Inter',
      profile: defaultProfile,
    };

    const initialSlides = [
      { id: 1, title: 'Fasted Morning Cardio', body: 'Game-Changer or Overhyped?', type: 'hook', titleSize: 'text-5xl', bodySize: 'text-2xl', icon: '🔥', alignment: 'text-left', boldBody: false },
      { id: 2, title: 'The Smart Way:', body: 'When paired with a smart plan, with the right timing, and at the right intensity... it can absolutely help you accelerate your results.', type: 'educational', titleSize: 'text-3xl', bodySize: 'text-xl', icon: '✅', alignment: 'text-left', boldBody: false },
      { id: 3, title: 'Action Plan', body: 'Join my free 7 day fat loss kick start challenge for consistent progress.', type: 'cta', titleSize: 'text-3xl', bodySize: 'text-xl', icon: '➡️', alignment: 'text-left', boldBody: false },
    ];

    const popularEmojis = ['💡','🚀','🔥','✅','❌','🔑','🧠','💪','🎯','💰','📈','📉','✨','🤯','🤔','👀','❤️','⚡️','⬇️','⬆️','➡️','🗓️','📖','🛠️'];

    let nextId = 4;

    // Helper for platform sizes
    const getPlatformDimensions = (platform) => {
      switch (platform) {
        case 'reels':
        case 'youtube':
        case 'tiktok':
          return { aspect: '9 / 16', maxWidth: 360, minHeight: 640 };
        default:
          return { aspect: '4 / 5', maxWidth: 400, minHeight: 500 };
      }
    };

    // -------------------------
    // Small SVG/icon components
    // -------------------------
    const Icon = ({ children, className = "w-6 h-6", onClick }) => (
      <div className={className} onClick={onClick} role="button" tabIndex="0" aria-label="icon button">
        <svg fill="none" viewBox="0 0 24 24" strokeWidth={2} stroke="currentColor" className="w-full h-full">
          {children}
        </svg>
      </div>
    );
    const ArrowRight = ({ className = "w-6 h-6", accentColor }) => (
      <svg xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24" strokeWidth={3} stroke={accentColor} className={className}>
        <path strokeLinecap="round" strokeLinejoin="round" d="M17.25 8.25L21 12m0 0l-3.75 3.75M21 12H3" />
      </svg>
    );
    const Trash = (props) => (<Icon {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M14.74 9l-.346 9m-4.788 0L9.26 9m9.968-3.21c.342.052.682.107 1.022.166m-1.022-.166L15.9 5.23L12 3L8.1 5.23m-4.04.595c.34.059.68.114 1.022.166m-1.022-.166L7.4 5.23L11.3 3m.7-3v21m0-21h-5.25a2.25 2.25 0 00-2.25 2.25v1.5a2.25 2.25 0 002.25 2.25H12V3h5.25A2.25 2.25 0 0019.5 5.25v1.5a2.25 2.25 0 00-2.25 2.25H12" /></Icon>);
    const Copy = (props) => (<Icon {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M15.75 17.25v2.25a.75.75 0 01-.75.75H4.5A2.25 2.25 0 012.25 18V7.5a2.25 2.25 0 012.25-2.25h9a.75.75 0 01.75.75V7.5M10.5 10.5h4.5a.75.75 0 00.75-.75V5.25a.75.75 0 00-.75-.75h-4.5a.75.75 0 00-.75.75v4.5a.75.75 0 00.75.75z" /></Icon>);
    const Plus = (props) => (<Icon {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M12 4.5v15m7.5-7.5h-15" /></Icon>);
    const Sparkles = (props) => (<Icon {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M9.813 15.904L9.428 17.4l-.16.657a.75.75 0 01-1.08.384l-.841-.531a.75.75 0 01-.337-.847L7.001 15.9m10.187-5.904l.385 1.496.16.657a.75.75 0 011.08.384l.841-.531a.75.75 0 01.337-.847l-.271-1.071m-2.126-2.126l.16.657a.75.75 0 01-1.08.384l-.841-.531a.75.75 0 01-.337-.847l.271-1.071m-2.126 2.126l-.385 1.496-.16.657a.75.75 0 01-1.08.384l-.841-.531a.75.75 0 01-.337-.847l.271-1.071" /></Icon>);
    const Edit = (props) => (<Icon {...props}><path strokeLinecap="round" strokeLinejoin="round" d="M16.862 4.487l1.687-1.688a1.875 1.875 0 112.652 2.652L10.582 18.288a.75.75 0 01-.225.594l-3.25 3.25a.75.75 0 01-.981-.227l-2.65-2.65a.75.75 0 01-.227-.981l3.25-3.25a.75.75 0 01.594-.225l10.58-10.58z" /></Icon>);

    // -------------------------
    // SlidePreview (honors title line breaks & body bold)
    // -------------------------
    const SlidePreview = React.forwardRef(({ slide, brandSettings, index, totalSlides, exportPlatform, creationMode }, ref) => {
      const { bgColor, textColor, headlineColor, accentColor, fontFamily, profile } = brandSettings;
      const { title, body, icon, alignment, boldBody } = slide;
      const isLastSlide = index === totalSlides - 1;
      const { aspect, maxWidth, minHeight } = getPlatformDimensions(exportPlatform || 'instagram');

      return (
        <div
          ref={ref}
          className="w-full p-8 shadow-2xl relative flex flex-col justify-between"
          style={{
            backgroundColor: bgColor,
            color: textColor,
            fontFamily: `${fontFamily}, sans-serif`,
            maxWidth: `${maxWidth}px`,
            aspectRatio: aspect,
            minHeight: `${minHeight}px`
          }}
        >
          {/* PROFILE HEADER */}
          <div className="absolute top-8 left-8 right-8 flex items-center justify-between z-10">
            <div className="flex items-center space-x-3">
              <img
                src={profile.photoUrl}
                alt="Profile"
                className="w-12 h-12 rounded-full border-2 object-cover"
                style={{ borderColor: accentColor }}
                onError={(e) => { e.target.onerror = null; e.target.src = "https://placehold.co/100x100/F7C400/000?text=P"; }}
              />
              <div>
                <div className="flex items-center space-x-1">
                  <p className="text-base font-bold leading-none" style={{ color: headlineColor }}>{profile.name}</p>
                  {profile.isVerified && (
                    <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill={accentColor} className="w-4 h-4">
                      <path fillRule="evenodd" d="M8.603 3.799A4.49 4.49 0 0112 2.25c1.357 0 2.573.6 3.397 1.549a4.49 4.49 0 013.498 1.307 4.491 4.491 0 011.307 3.497A4.49 4.49 0 0121.75 12a4.49 4.49 0 01-1.549 3.397 4.491 4.491 0 01-1.307 3.497 4.491 4.491 0 01-3.497 1.307A4.49 4.49 0 0112 21.75a4.49 4.49 0 01-3.397-1.549 4.49 4.49 0 01-3.498-1.306 4.491 4.491 0 01-1.307-3.498A4.49 4.49 0 012.25 12c0-1.357.6-2.573 1.549-3.397a4.49 4.49 0 011.307-3.497 4.49 4.49 0 013.497-1.307zm7.007 6.387a.75.75 0 10-1.22-.872l-3.236 4.53L9.53 12.22a.75.75 0 00-1.06 1.06l2.25 2.25a.75.75 0 001.14-.094l3.75-5.25z" clipRule="evenodd" />
                    </svg>
                  )}
                </div>
                <p className="text-sm font-semibold leading-none opacity-80" style={{ color: accentColor }}>{profile.website}</p>
              </div>
            </div>

            {creationMode === 'carousel' ? (<span className="text-sm opacity-60">{index + 1}/{totalSlides}</span>) : null}
          </div>

          {/* CONTENT */}
          <div className={`flex-grow flex flex-col justify-center py-20 ${alignment}`}>
            {icon && <span className="text-6xl mb-4">{icon}</span>}

            {/* Title now honors line breaks */}
            <h1
              className={`font-black tracking-tight mb-4 ${slide.titleSize || 'text-5xl'} whitespace-pre-line`}
              style={{ lineHeight: 1.1, color: headlineColor }}
            >
              {title}
            </h1>

            {/* Body honors line breaks and can be bold */}
            <p
              className={`${boldBody ? 'font-bold' : 'font-light'} ${slide.bodySize || 'text-xl'} leading-relaxed whitespace-pre-line`}
              style={{ color: textColor }}
            >
              {body}
            </p>
          </div>

          {/* Bottom arrow/pagination in carousel only */}
          {creationMode === 'carousel' && (
            <div className="absolute bottom-8 right-8 flex justify-end items-center">
              {!isLastSlide ? (
                <ArrowRight className="w-12 h-12" accentColor={accentColor} />
              ) : (
                <p className="text-sm font-bold" style={{ color: accentColor }}>END</p>
              )}
            </div>
          )}
        </div>
      );
    });

    // -------------------------
    // AIGenerationController (min slides depends on creationMode)
    // -------------------------
    const AIGenerationController = ({ setSlides, setIsLoading, isLoading, setContentMode, creationMode }) => {
      const [aiTopic, setAiTopic] = useState('');
      // default slide count 4 for carousel, 1 for single
      const defaultCount = creationMode === 'single' ? 1 : 4;
      const [aiSlideCount, setAiSlideCount] = useState(String(defaultCount));

      useEffect(() => {
        // when creationMode changes, update min/default
        setAiSlideCount(String(creationMode === 'single' ? 1 : Math.max(2, parseInt(aiSlideCount || '2', 10))));
        // eslint-disable-next-line
      }, [creationMode]);

      const generateContentAI = async () => {
        const slideCount = parseInt(aiSlideCount, 10);
        const minAllowed = creationMode === 'single' ? 1 : 2;
        if (!aiTopic || isNaN(slideCount) || slideCount < minAllowed || slideCount > 10) {
          console.error('Invalid topic or slide count.');
          return;
        }

        setIsLoading(true);

        // fallback simple structure if API unreachable
        const structure = [];
        if (slideCount >= 1) structure.push('{ "title": "Hook Title", "body": "Catchy starting line...", "type": "hook", "icon": "🔥" }');
        for (let i = 0; i < Math.max(0, slideCount - 2); i++) {
          structure.push(`{ "title": "Key Point ${i+1}", "body": "Educational detail ${i+1}...", "type": "educational", "icon": "✅" }`);
        }
        if (slideCount > 1) structure.push('{ "title": "Call to Action", "body": "Motivational summary and CTA...", "type": "cta", "icon": "➡️" }');

        const systemPrompt = `You are a professional social media content creator specializing in bold, minimal Instagram carousels. The output MUST be a JSON array of exactly ${slideCount} objects: [${structure.join(', ')}]. The first slide MUST have type "hook", the last slide MUST have type "cta" (if slideCount > 1), and slides in between MUST be "educational". No conversational text outside the JSON. Use relevant emojis.`;
        const userQuery = `Create a ${slideCount}-slide Instagram carousel content structure for the topic: "${aiTopic}".`;

        const payload = {
          contents: [{ parts: [{ text: userQuery }] }],
          systemInstruction: { parts: [{ text: systemPrompt }] },
          generationConfig: {
            responseMimeType: "application/json",
            responseSchema: {
              type: "ARRAY",
              items: {
                type: "OBJECT",
                properties: {
                  "title": { "type": "STRING" },
                  "body": { "type": "STRING" },
                  "type": { "type": "STRING", "enum": ["hook","educational","cta"] },
                  "icon": { "type": "STRING" }
                },
                required: ["title","body","type","icon"]
              }
            }
          }
        };

        try {
          const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-2.5-flash-preview-09-2025:generateContent?key=${API_KEY}`;
          let response;
          let result;
          const maxRetries = 3;
          let attempt = 0;
          while (attempt < maxRetries) {
            attempt++;
            try {
              response = await fetch(apiUrl, {
                method: 'POST',
                headers: { 'Content-Type': 'application/json' },
                body: JSON.stringify(payload)
              });
            } catch (err) {
              if (attempt >= maxRetries) throw err;
              await new Promise(r => setTimeout(r, 500 * attempt));
              continue;
            }

            if (response.ok) {
              result = await response.json();
              break;
            } else if (attempt < maxRetries && response.status === 429) {
              await new Promise(r => setTimeout(r, 1000 * (2 ** attempt)));
            } else {
              // break and fallback to simple structure below
              break;
            }
          }

          let parsedJson;
          if (result && result.candidates && result.candidates.length > 0) {
            const jsonString = result.candidates[0].content.parts[0].text;
            parsedJson = JSON.parse(jsonString);
          } else {
            // fallback: construct simple slides
            parsedJson = [];
            if (slideCount >= 1) parsedJson.push({ title: "Hook", body: aiTopic, type: "hook", icon: "🔥" });
            for (let i=0;i<Math.max(0,slideCount-2);i++) parsedJson.push({ title: `Point ${i+1}`, body: "Key detail...", type: "educational", icon: "✅" });
            if (slideCount > 1) parsedJson.push({ title: "CTA", body: "Join now", type: "cta", icon: "➡️" });
          }

          const newSlides = parsedJson.map((s, idx) => ({
            id: nextId++,
            title: s.title,
            body: s.body,
            type: s.type,
            icon: s.icon || '',
            titleSize: idx === 0 ? 'text-5xl' : 'text-3xl',
            bodySize: idx === 0 ? 'text-2xl' : 'text-xl',
            alignment: 'text-left',
            boldBody: false
          }));

          setSlides(newSlides);
          setContentMode('manual');
        } catch (err) {
          console.error('AI gen error', err);
        } finally {
          setIsLoading(false);
        }
      };

      const handleCountChange = (step) => {
        const current = parseInt(aiSlideCount || '0', 10);
        const min = creationMode === 'single' ? 1 : 2;
        let next = isNaN(current) ? (min) : current + step;
        next = Math.max(min, Math.min(10, next));
        setAiSlideCount(String(next));
      };

      const resetAI = () => {
        setAiTopic('');
        setAiSlideCount(creationMode === 'single' ? '1' : '4');
        setIsLoading(false);
      };

      const currentSlideCount = parseInt(aiSlideCount || (creationMode === 'single' ? '1' : '4'), 10);
      const minAllowed = creationMode === 'single' ? 1 : 2;

      return (
        <div className="space-y-4">
          <h3 className="text-lg font-bold text-indigo-400 flex items-center">
            <Sparkles className="w-5 h-5 mr-2 text-yellow-400" /> Auto-Generate Slides
          </h3>
          <p className="text-sm text-gray-400">Enter a topic and desired number of slides. In Single Image mode the minimum is 1.</p>

          <label className="block text-sm font-medium text-gray-400">Carousel Topic</label>
          <div className="flex space-x-2">
            <input type="text" placeholder="E.g., 5 ways to improve shoulder mobility" value={aiTopic} onChange={(e)=>setAiTopic(e.target.value)} className="flex-1 p-3 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm" disabled={isLoading}/>
            <button onClick={resetAI} disabled={isLoading} className={`p-3 rounded-lg text-sm font-semibold ${isLoading ? 'bg-gray-700 text-gray-500 cursor-not-allowed' : 'bg-red-600 hover:bg-red-700 text-white'}`}>Clear</button>
          </div>

          <label className="block text-sm font-medium text-gray-400">Number of Slides ({minAllowed}-10)</label>
          <div className="flex items-center justify-center gap-2 w-full">
            <button onClick={()=>handleCountChange(-1)} disabled={isLoading || currentSlideCount <= minAllowed} className="flex-shrink-0 p-3 bg-gray-700 text-white rounded-lg hover:bg-gray-600 disabled:opacity-50">-</button>
            <div className="flex-grow">
              <input type="text" readOnly value={String(currentSlideCount)} className="w-full text-center p-3 bg-gray-700 border border-indigo-500 rounded-lg text-white text-xl font-extrabold"/>
            </div>
            <button onClick={()=>handleCountChange(1)} disabled={isLoading || currentSlideCount >= 10} className="flex-shrink-0 p-3 bg-gray-700 text-white rounded-lg hover:bg-gray-600 disabled:opacity-50">+</button>
          </div>

          <button onClick={generateContentAI} disabled={isLoading || !aiTopic || currentSlideCount < minAllowed || currentSlideCount > 10} className={`w-full flex items-center justify-center p-3 font-bold rounded-lg ${isLoading ? 'bg-indigo-700 cursor-not-allowed text-gray-400' : 'bg-indigo-600 hover:bg-indigo-700 text-white'}`}>
            {isLoading ? (<svg className="animate-spin -ml-1 mr-3 h-5 w-5 text-white" xmlns="http://www.w3.org/2000/svg" fill="none" viewBox="0 0 24 24"><circle className="opacity-25" cx="12" cy="12" r="10" stroke="currentColor" strokeWidth="4"></circle><path className="opacity-75" fill="currentColor" d="M4 12a8 8 0 018-8V0C5.373 0 0 5.373 0 12h4z"></path></svg>) : (<Sparkles className="w-5 h-5 mr-1" />)}
            {isLoading ? 'Generating...' : 'Start AI Generation'}
          </button>
        </div>
      );
    };

    // -------------------------
    // ContentEditorOptimized (title preserves line breaks, body sizes up to 4XL, bold toggle, alignment)
    // -------------------------
    const ContentEditorOptimized = ({ activeSlide, activeSlideIndex, handleSlideUpdate }) => {
      const [localTitle, setLocalTitle] = useState(activeSlide?.title || '');
      const [localBody, setLocalBody] = useState(activeSlide?.body || '');
      const [isPickerOpen, setIsPickerOpen] = useState(false);
      const pickerRef = useRef(null);
      const inputRef = useRef(null);

      useEffect(() => {
        if (activeSlide) {
          setLocalTitle(activeSlide.title);
          setLocalBody(activeSlide.body);
        }
      }, [activeSlide]);

      useEffect(() => {
        const onClick = (e) => {
          if (isPickerOpen && pickerRef.current && !pickerRef.current.contains(e.target) && inputRef.current && !inputRef.current.contains(e.target)) {
            setIsPickerOpen(false);
          }
        };
        document.addEventListener('mousedown', onClick);
        return () => document.removeEventListener('mousedown', onClick);
      }, [isPickerOpen]);

      const handleTitleBlur = () => {
        if (localTitle !== activeSlide.title) handleSlideUpdate('title', localTitle);
      };
      const handleBodyBlur = () => {
        if (localBody !== activeSlide.body) handleSlideUpdate('body', localBody);
      };
      const handleIconSelect = (emoji) => { handleSlideUpdate('icon', emoji); setIsPickerOpen(false); };
      const handleInstantUpdate = (key, value) => { handleSlideUpdate(key, value); };

      if (!activeSlide) return <p className="text-gray-400">Select a slide to edit.</p>;

      return (
        <div className="space-y-4">
          <h3 className="text-lg font-bold text-white">Slide {activeSlideIndex + 1} Content</h3>

          <label className="block text-sm font-medium text-gray-400">Title</label>
          <textarea rows="2" value={localTitle} onChange={(e)=>setLocalTitle(e.target.value)} onBlur={handleTitleBlur} placeholder="Slide Title" className="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white font-bold text-xl resize-none" />

          <label className="block text-sm font-medium text-gray-400">Body Content</label>
          <textarea rows="5" value={localBody} onChange={(e)=>setLocalBody(e.target.value)} onBlur={handleBodyBlur} placeholder="Detailed content. Use Enter for line breaks." className="w-full p-3 bg-gray-700 border border-gray-600 rounded-lg text-white text-base resize-none" />

          <div className="flex space-x-4">
            <div className="flex-1 relative">
              <label className="block text-sm font-medium text-gray-400">Icon/Emoji</label>
              <div ref={inputRef} onClick={() => setIsPickerOpen(prev => !prev)} className={`w-full p-3 border rounded-lg text-white text-2xl text-center cursor-pointer flex items-center justify-center h-[52px] transition ${activeSlide.icon ? 'bg-gray-700 border-gray-600' : 'bg-gray-800 border-dashed border-gray-600 hover:border-indigo-500'}`} role="button">
                {activeSlide.icon ? activeSlide.icon : <span className="text-sm text-gray-400">Click to Select</span>}
              </div>
              {isPickerOpen && (
                <div ref={pickerRef} className="absolute top-full mt-2 left-0 right-0 bg-gray-700 p-3 rounded-lg shadow-2xl z-20 grid grid-cols-6 gap-2 border border-indigo-500">
                  {popularEmojis.map(e => (<button key={e} onClick={()=>handleIconSelect(e)} className="p-1 text-2xl rounded-md hover:bg-gray-600 transition">{e}</button>))}
                  <button onClick={()=>handleIconSelect('')} className="col-span-6 p-1 text-sm text-center text-red-400 rounded-md hover:bg-gray-600 transition">Clear Icon</button>
                </div>
              )}
            </div>
          </div>

          <div className="flex space-x-4">
            <div className="flex-1">
              <label className="block text-sm font-medium text-gray-400">Title Size</label>
              <select value={activeSlide.titleSize || 'text-3xl'} onChange={(e)=>handleInstantUpdate('titleSize', e.target.value)} className="w-full p-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm">
                <option value="text-xl">XL</option>
                <option value="text-3xl">3XL</option>
                <option value="text-5xl">5XL</option>
                <option value="text-7xl">7XL</option>
              </select>
            </div>
            <div className="flex-1">
              <label className="block text-sm font-medium text-gray-400">Body Size</label>
              <select value={activeSlide.bodySize || 'text-xl'} onChange={(e)=>handleInstantUpdate('bodySize', e.target.value)} className="w-full p-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm">
                <option value="text-sm">SM</option>
                <option value="text-base">Base</option>
                <option value="text-xl">XL</option>
                <option value="text-2xl">2XL</option>
                <option value="text-3xl">3XL</option>
                <option value="text-4xl">4XL</option>
              </select>
            </div>
          </div>

          <div className="flex items-center justify-between">
            <label className="text-sm font-medium text-gray-400">Bold Body Text</label>
            <button onClick={() => handleInstantUpdate('boldBody', !activeSlide.boldBody)} className={`px-4 py-2 rounded-lg font-semibold transition ${activeSlide.boldBody ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>{activeSlide.boldBody ? 'BOLD ON' : 'BOLD OFF'}</button>
          </div>

          <div>
            <label className="block text-sm font-medium text-gray-400 mb-1">Text Alignment (Active Slide)</label>
            <div className="flex space-x-2">
              {['text-left','text-center','text-right'].map(al => (
                <button key={al} onClick={()=>handleInstantUpdate('alignment', al)} className={`flex-1 py-2 rounded-lg font-semibold transition ${activeSlide.alignment === al ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>{al.replace('text-','').toUpperCase()}</button>
              ))}
            </div>
          </div>
        </div>
      );
    };

    // -------------------------
    // ColorPicker + Brand panel (kept)
    // -------------------------
    const ColorPicker = ({ label, value, onChange, colorKey }) => {
      const [localColor, setLocalColor] = useState(value);
      useEffect(()=> setLocalColor(value), [value]);
      return (
        <div className="flex items-center justify-between">
          <label className="text-sm font-medium text-gray-400">{label}</label>
          <input type="color" value={localColor} onChange={(e)=>setLocalColor(e.target.value)} onBlur={()=>onChange(colorKey, localColor)} className="w-10 h-10 border-2 border-gray-600 rounded-lg cursor-pointer"/>
        </div>
      )
    };

    // -------------------------
    // Main App (full-featured)
    // -------------------------
    const App = () => {
      // states
      const [brandSettings, setBrandSettings] = useState(defaultBrandSettings);
      const [slides, setSlides] = useState(initialSlides);
      const [activeSlideIndex, setActiveSlideIndex] = useState(0);
      const [isLoading, setIsLoading] = useState(false);
      const [isDownloading, setIsDownloading] = useState(false);
      const [contentMode, setContentMode] = useState('manual');
      const [exportFormat, setExportFormat] = useState('png');
      const [exportPlatform, setExportPlatform] = useState('instagram');
      const [creationMode, setCreationMode] = useState('carousel'); // NEW
      const slideRefs = useRef({});

      const activeSlide = slides[activeSlideIndex];

      // brand handlers
      const handleBrandChange = (key, value) => {
        if (key === 'profileName') setBrandSettings(prev => ({ ...prev, profile: { ...prev.profile, name: value }}));
        else if (key === 'profileWebsite') setBrandSettings(prev => ({ ...prev, profile: { ...prev.profile, website: value }}));
        else if (key === 'profileVerified') setBrandSettings(prev => ({ ...prev, profile: { ...prev.profile, isVerified: value }}));
        else setBrandSettings(prev => ({ ...prev, [key]: value }));
      };

      const handleProfileImageUpload = (e) => {
        const file = e.target.files?.[0];
        if (file) {
          const reader = new FileReader();
          reader.onload = (ev) => setBrandSettings(prev => ({ ...prev, profile: { ...prev.profile, photoUrl: ev.target.result }}));
          reader.readAsDataURL(file);
        }
      };

      // slide CRUD
      const handleSlideUpdate = (key, value) => {
        const next = slides.map((s, idx) => idx === activeSlideIndex ? { ...s, [key]: value } : s);
        setSlides(next);
      };

      const addSlide = (type='educational') => {
        const obj = { id: nextId++, title: 'New Slide Title', body: 'New content here.', type, icon: '', titleSize: 'text-3xl', bodySize: 'text-xl', alignment: 'text-left', boldBody: false};
        setSlides(prev => [...prev, obj]);
        setActiveSlideIndex(slides.length);
      };

      const deleteSlide = (index) => {
        if (slides.length <= 1) return;
        const newSlides = slides.filter((_,i)=>i!==index);
        setSlides(newSlides);
        setActiveSlideIndex(Math.max(0, index-1));
      };

      const duplicateSlide = (index) => {
        const toDup = slides[index];
        const dup = { ...toDup, id: nextId++ };
        const newSlides = [...slides.slice(0,index+1), dup, ...slides.slice(index+1)];
        setSlides(newSlides);
        setActiveSlideIndex(index+1);
      };

      const reorderSlide = (from, to) => {
        const arr = [...slides];
        const [moved] = arr.splice(from,1);
        arr.splice(to,0,moved);
        setSlides(arr);
        setActiveSlideIndex(to);
      };

      // html2canvas exports (all)
      const handleDownload = async (format='png') => {
        if (typeof window.html2canvas === 'undefined') { console.error('html2canvas missing'); return; }
        if (slides.length === 0) { console.warn('No slides'); return; }
        setIsDownloading(true);
        try {
          for (let i=0;i<slides.length;i++){
            const el = slideRefs.current[slides[i].id];
            if (!el) { console.error('Missing ref for slide', slides[i].id); continue; }
            const canvas = await window.html2canvas(el, { scale: 3, useCORS: true, allowTaint: true });
            const dataUrl = canvas.toDataURL(`image/${format}`, format === 'jpeg' ? 0.9 : 1.0);
            const link = document.createElement('a');
            link.href = dataUrl;
            link.download = `carousel_slide_${i+1}_${slides[i].title.replace(/\s/g,'_').substring(0,20)}.${format}`;
            document.body.appendChild(link);
            link.click();
            document.body.removeChild(link);
            await new Promise(r=>setTimeout(r,300));
          }
        } catch (err) { console.error('Export error', err); }
        finally { setIsDownloading(false); }
      };

      // download current only
      const handleDownloadSingle = async (format='png') => {
        if (typeof window.html2canvas === 'undefined') { console.error('html2canvas missing'); return; }
        const slide = slides[activeSlideIndex];
        if (!slide) { console.warn('No active slide'); return; }
        setIsDownloading(true);
        try {
          const el = slideRefs.current[slide.id];
          if (!el) { console.error('Missing ref'); setIsDownloading(false); return; }
          const canvas = await window.html2canvas(el, { scale: 3, useCORS: true, allowTaint: true });
          const dataUrl = canvas.toDataURL(`image/${format}`, format === 'jpeg' ? 0.9 : 1.0);
          const link = document.createElement('a');
          link.href = dataUrl;
          link.download = `slide_${activeSlideIndex+1}_${slide.title.replace(/\s/g,'_').substring(0,20)}.${format}`;
          document.body.appendChild(link);
          link.click();
          document.body.removeChild(link);
        } catch (err) { console.error('Download single error', err); }
        finally { setIsDownloading(false); }
      };

      // set refs for hidden export area and live preview
      const setSlideRef = useCallback((el, id) => {
        if (el) slideRefs.current[id] = el;
        else delete slideRefs.current[id];
      }, []);

      // brand panel component
      const BrandSetupPanel = () => (
        <div className="space-y-4">
          <h3 className="text-lg font-bold text-white">Brand & Colors</h3>
          <ColorPicker label="Background Color" value={brandSettings.bgColor} onChange={handleBrandChange} colorKey="bgColor" />
          <ColorPicker label="Text Color (Body)" value={brandSettings.textColor} onChange={handleBrandChange} colorKey="textColor" />
          <ColorPicker label="Headline Color" value={brandSettings.headlineColor} onChange={handleBrandChange} colorKey="headlineColor" />
          <ColorPicker label="Accent/CTA Color" value={brandSettings.accentColor} onChange={handleBrandChange} colorKey="accentColor" />

          <label className="block text-sm font-medium text-gray-400">Platform</label>
          <select value={exportPlatform} onChange={(e)=>setExportPlatform(e.target.value)} className="w-full p-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm mb-4">
            <option value="instagram">Instagram (4:5)</option>
            <option value="reels">Reels / TikTok / Shorts (9:16)</option>
          </select>

          <div className="border-t border-gray-700 pt-4 space-y-3">
            <h4 className="font-semibold text-gray-300">Profile Header</h4>
            <div className="flex items-center space-x-3 p-2 bg-gray-700 rounded-lg">
              <img src={brandSettings.profile.photoUrl} alt="Profile Preview" className="w-10 h-10 rounded-full object-cover border-2" style={{ borderColor: brandSettings.accentColor }} onError={(e)=>{e.target.onerror=null; e.target.src="https://placehold.co/100x100/F7C400/000?text=P";}}/>
              <label htmlFor="profile-upload" className="flex-1 p-1 text-sm bg-gray-600 hover:bg-gray-500 rounded-md text-white text-center cursor-pointer transition truncate">{brandSettings.profile.photoUrl.startsWith('data:') ? 'Change Photo' : 'Upload Photo'}</label>
              <input id="profile-upload" type="file" accept="image/*" onChange={handleProfileImageUpload} className="hidden"/>
            </div>

            <input type="text" placeholder="Profile Name" value={brandSettings.profile.name} onChange={(e)=>handleBrandChange('profileName', e.target.value)} className="w-full p-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm" />
            <input type="text" placeholder="Website/CTA" value={brandSettings.profile.website} onChange={(e)=>handleBrandChange('profileWebsite', e.target.value)} className="w-full p-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm" />
            <div className="flex items-center space-x-2 p-2 bg-gray-700 rounded-lg">
              <input id="verified-badge" type="checkbox" checked={brandSettings.profile.isVerified} onChange={(e)=>handleBrandChange('profileVerified', e.target.checked)} className="w-4 h-4 text-indigo-600 bg_gray_600 border-gray-500 rounded"/>
              <label htmlFor="verified-badge" className="text-sm text-gray-300">Show Verification Badge</label>
            </div>

            <select value={brandSettings.fontFamily} onChange={(e)=>handleBrandChange('fontFamily', e.target.value)} className="w-full p-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm" style={{ fontFamily: brandSettings.fontFamily }}>
              <option value="Inter" style={{ fontFamily: 'Inter' }}>Inter (Default)</option>
              <option value="Montserrat" style={{ fontFamily: 'Montserrat' }}>Montserrat</option>
              <option value="Roboto" style={{ fontFamily: 'Roboto' }}>Roboto</option>
            </select>
          </div>
        </div>
      );

      // Content mode selector
      const ContentModeSelector = () => (
        <div className="p-1 bg-gray-700 rounded-xl flex shadow-lg border border-gray-600 mb-6">
          <button onClick={()=>setContentMode('auto')} className={`flex-1 p-3 text-sm font-semibold rounded-lg ${contentMode==='auto' ? 'bg-indigo-600 text-white shadow-xl' : 'text-gray-300 hover:bg-gray-600'}`}><Sparkles className="w-4 h-4 mr-2"/> Auto Generate</button>
          <button onClick={()=>setContentMode('manual')} className={`flex-1 p-3 text-sm font-semibold rounded-lg ${contentMode==='manual' ? 'bg-indigo-600 text-white shadow-xl' : 'text-gray-300 hover:bg-gray-600'}`}><Edit className="w-4 h-4 mr-2"/> Manually Enter Content</button>
        </div>
      );

      // Slide list
      const SlideList = () => (
        <div className="space-y-3">
          <h3 className="text-lg font-bold text-white">Slide Manager ({slides.length} total)</h3>
          <div className="space-y-2 max-h-60 overflow-y-auto pr-2">
            {slides.map((slide, index)=>(
              <div key={slide.id} className={`p-3 rounded-lg cursor-pointer flex justify-between items-center transition-all ${index===activeSlideIndex ? 'bg-indigo-600 shadow-lg' : 'bg-gray-700 hover:bg-gray-600'}`} onClick={()=>setActiveSlideIndex(index)} draggable onDragStart={(e)=>e.dataTransfer.setData("slideIndex", index)} onDragOver={(e)=>e.preventDefault()} onDrop={(e)=>{ e.preventDefault(); const from = parseInt(e.dataTransfer.getData("slideIndex"),10); reorderSlide(from, index); }}>
                <span className="text-sm font-semibold text-white truncate">{index+1}. {slide.title || 'Untitled Slide'}</span>
                <div className="flex space-x-2">
                  <Copy className="w-5 h-5 text-gray-300 hover:text-white" onClick={(ev)=>{ ev.stopPropagation(); duplicateSlide(index); }} />
                  {slides.length>1 && <Trash className="w-5 h-5 text-red-400 hover:text-red-500" onClick={(ev)=>{ ev.stopPropagation(); deleteSlide(index); }} />}
                </div>
              </div>
            ))}
          </div>
          <button onClick={()=>addSlide()} className="w-full flex items-center justify-center p-2 mt-4 bg-gray-700 text-gray-300 font-semibold rounded-lg hover:bg-gray-600 transition"><Plus className="w-5 h-5 mr-2" /> Add New Slide</button>
        </div>
      );

      // Main UI render
      return (
        <div className="min-h-screen bg-gray-900 text-white p-4 sm:p-8 font-inter">
          <header className="mb-8 border-b border-gray-700 pb-4">
            <h1 className="text-3xl font-extrabold text-white"><span className="text-indigo-400">IG</span> Carousel Creator</h1>
            <p className="text-gray-400 mt-1">Design, Brand, and Auto-Generate high-impact Instagram content.</p>
          </header>

          {/* Creation Mode Toggle */}
          <div className="mb-6 flex items-center space-x-3 bg-gray-800 border border-gray-700 rounded-xl p-3 shadow-md">
            <label className="text-sm font-semibold text-gray-300">Creation Mode:</label>
            <button onClick={()=>setCreationMode(prev=> prev==='carousel' ? 'single' : 'carousel')} className={`px-4 py-2 rounded-lg font-bold transition ${creationMode==='carousel' ? 'bg-indigo-600 text-white' : 'bg-gray-700 text-gray-300 hover:bg-gray-600'}`}>{creationMode==='carousel' ? 'Carousel Mode' : 'Single Image Mode'}</button>
            <p className="text-sm text-gray-400 ml-4">{creationMode==='carousel' ? 'Multiple slides with navigation.' : 'One clean image — arrows & pagination hidden.'}</p>
          </div>

          <div className="grid grid-cols-1 lg:grid-cols-12 gap-6">
            {/* Left */}
            <div className="lg:col-span-3 space-y-6">
              <div className="p-5 bg-gray-800 rounded-xl shadow-lg border border-gray-700"><BrandSetupPanel /></div>
              <ContentModeSelector />
              <div className="p-5 bg-gray-800 rounded-xl shadow-lg border border-gray-700">
                {contentMode === 'auto' ? (<AIGenerationController setSlides={setSlides} setIsLoading={setIsLoading} isLoading={isLoading} setContentMode={setContentMode} creationMode={creationMode} />) : (<SlideList />)}
              </div>
            </div>

            {/* Center */}
            <div className="lg:col-span-6 space-y-6">
              <div className="flex justify-center items-center w-full">
                {slides.length > 0 ? (
                  <div className="w-full flex justify-center">
                    <SlidePreview ref={(el)=>setSlideRef(el, slides[activeSlideIndex].id)} slide={activeSlide} brandSettings={brandSettings} index={activeSlideIndex} totalSlides={slides.length} exportPlatform={exportPlatform} creationMode={creationMode} />
                  </div>
                ) : (
                  <div className="w-full aspect-[4/5] max-w-[400px] h-auto p-8 shadow-2xl relative flex items-center justify-center bg-gray-800 border-4 border-dashed border-gray-600" style={{ minHeight: '500px' }}>
                    <p className="text-gray-400 font-semibold text-center">No Slides. Use Auto Generate or Add a Slide manually.</p>
                  </div>
                )}
              </div>

              <div className="flex justify-center space-x-3 p-4 bg-gray-800 rounded-xl border border-gray-700">
                <button onClick={()=>setActiveSlideIndex(Math.max(0, activeSlideIndex - 1))} disabled={activeSlideIndex===0 || slides.length===0} className="p-2 bg-gray-700 text-gray-300 rounded-lg hover:bg-gray-600 disabled:opacity-50">Previous</button>
                <button onClick={()=>setActiveSlideIndex(Math.min(slides.length-1, activeSlideIndex + 1))} disabled={activeSlideIndex===slides.length-1 || slides.length===0} className="p-2 bg-gray-700 text-gray-300 rounded-lg hover:bg-gray-600 disabled:opacity-50">Next</button>
              </div>

              <div className="p-5 bg-gray-800 rounded-xl shadow-lg border border-gray-700">
                <ContentEditorOptimized activeSlide={activeSlide} activeSlideIndex={activeSlideIndex} handleSlideUpdate={handleSlideUpdate} />
              </div>
            </div>

            {/* Right */}
            <div className="lg:col-span-3 space-y-6">
              <div className="p-5 bg-gray-800 rounded-xl shadow-lg border border-gray-700 space-y-4">
                <h3 className="text-lg font-bold text-white">Export Slides</h3>
                <div className="space-y-3">
                  <label className="text-sm text-gray-300">Format</label>
                  <select value={exportFormat} onChange={(e)=>setExportFormat(e.target.value)} className="w-full p-2 bg-gray-700 border border-gray-600 rounded-lg text-white text-sm">
                    <option value="png">PNG (Best quality)</option>
                    <option value="jpeg">JPG (Smaller files)</option>
                  </select>

                  <button onClick={()=>handleDownload(exportFormat)} disabled={isDownloading || slides.length===0} className={`w-full p-3 text-white font-semibold rounded-lg ${isDownloading ? 'bg-green-700/50 cursor-not-allowed' : 'bg-green-600 hover:bg-green-700'}`}>{isDownloading ? 'Processing All Slides...' : '💻 Download All Slides (Desktop Only)'}</button>

                  <button onClick={()=>handleDownloadSingle(exportFormat)} disabled={isDownloading || slides.length===0} className={`w-full p-3 text-white font-semibold rounded-lg ${isDownloading ? 'bg-blue-700/50 cursor-not-allowed' : 'bg-blue-600 hover:bg-blue-700'}`}>{isDownloading ? 'Processing...' : `📱 Download Current Slide (${activeSlideIndex+1}/${slides.length})`}</button>
                </div>
                {isDownloading && <p className="text-sm text-center text-yellow-400">Don't close the window while images are downloading.</p>}
              </div>
            </div>
          </div>

          {/* Hidden export rendering: all slides (for html2canvas) */}
          <div className="fixed top-0 left-0 w-full h-full -z-50 opacity-0 pointer-events-none">
            {slides.map((s, idx)=>(
              <div key={s.id} className="absolute" style={{ top: idx * 1200, left: 0 }}>
                <SlidePreview ref={(el)=>setSlideRef(el, s.id)} slide={s} brandSettings={brandSettings} index={idx} totalSlides={slides.length} exportPlatform={exportPlatform} creationMode={creationMode} />
              </div>
            ))}
          </div>
        </div>
      );
    };

    // render
    const root = ReactDOM.createRoot(document.getElementById('root'));
    root.render(<App />);
  </script>
</body>
</html>
